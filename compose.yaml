services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: wovn
      POSTGRES_USER: wovn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wovn -d wovn"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production.local
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production.local
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
